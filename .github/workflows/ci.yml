name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify compilation
        run: |
          python -m compileall apex main.py tools

      - name: Run headless smoke test (Title Screen)
        run: |
          python main.py --shot screenshot_title.png --title

      - name: Run headless smoke test (Gameplay Autopilot)
        run: |
          python main.py --shot screenshot_gameplay.png --frames 180

      - name: Upload screenshots artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: game-screenshots
          path: |
            screenshot_title.png
            screenshot_gameplay.png
